[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "1.0.0"
description = "A truthful Git activity reporter and repository health checker."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Akhil Alladi"}]
dependencies = []

[project.scripts]
gitpulse = "gitpulse.cli:main"

[tool.setuptools.packages.find]
include = ["gitpulse*"]
